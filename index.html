:root{
  --lime:#BBBF15;         /* CM Akzent */
  --lime-d:#AAAD00;
  --lime-t:#F1F2CC;       /* CM Tint-Fläche */
  --a:#75781C;            /* Team A – CM Oliv */
  --b:#2C63C4;            /* Team B */
  --surface:#F7F7F7;
  --card:#ffffff;
  --line:#E2E2DC;
  --ink:#3C3C3C;
  --ink2:#6B6B67;
  --muted:#9A9A93;
  --ok:#75781C;
  --warn:#A86A00;
  --crit:#B23A2B;
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root{
    --lime:#C8CC2A; --lime-d:#B4B812; --lime-t:#3A3B23;
    --a:#75781C; --b:#2C63C4;
    --surface:#21211E; --card:#2B2B27; --line:#3E3E39;
    --ink:#F2F1EC; --ink2:#C4C2BA; --muted:#8E8C84;
    --warn:#D79A2B; --crit:#DD7466;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--ink);
  font-family:'Exo 2',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; font-weight:500; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:560px;margin:0 auto;padding:10px 14px 7px;display:flex;align-items:flex-start;gap:12px}
.brand{flex:1;min-width:0;border-left:3px solid var(--lime);padding-left:9px}
.brand .t{font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.brand .c{font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.logo{width:96px;height:auto;flex:0 0 auto;margin-top:1px}
@media (prefers-color-scheme: dark){ .logo{filter:brightness(1.35) contrast(.9)} }

/* ---------- Score-Leiste ---------- */
.scorebar{max-width:560px;margin:0 auto;padding:0 14px 8px;display:flex;align-items:stretch;gap:6px}
.sb{flex:1 1 0;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:var(--radius);
  color:#fff;min-width:0;cursor:pointer}
.sb.a{background:var(--a)} .sb.b{background:var(--b);justify-content:flex-end;text-align:right}
.sb .nm{font-size:12px;font-weight:500;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb .pt{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;letter-spacing:-.01em}
.sb .lead{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--lime)}
.clock{flex:0 0 auto;width:74px;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:3px 2px 2px}
.clock .t{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.clock.warn .t{color:var(--warn)} .clock.crit .t{color:var(--crit)}
.clock .btns{display:flex;gap:1px;justify-content:center}
.clock button{border:0;background:transparent;color:var(--ink2);font-size:12px;padding:0 5px;cursor:pointer;line-height:1.2}

/* ---------- Tabs ---------- */
nav{display:flex;gap:5px;overflow-x:auto;padding:0 14px 9px;max-width:560px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  padding:7px 12px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit}
nav button.on{background:var(--lime);border-color:var(--lime);color:#3C3C3C}
nav button.eval{border-color:var(--lime)}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime-d);margin-left:5px;vertical-align:middle}
nav button.on .dot{background:#3C3C3C}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;margin-top:12px}
h2{font-size:19px;font-weight:600;margin:0 0 1px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
h3{font-size:11.5px;margin:16px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
h3.tight{margin-top:10px}
ul.rules{margin:12px 0 0;padding-left:16px;color:var(--ink2);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
ul.rules li{margin:3px 0}
ul.rules li::marker{color:var(--lime-d)}

button.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:12px 10px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button.btn:active{transform:scale(.985)}
button.btn.primary{background:var(--lime);border-color:var(--lime);color:#3C3C3C}
button.btn.ghost{color:var(--ink2)}
button.btn.a{background:var(--a);border-color:var(--a);color:#fff}
button.btn.b{background:var(--b);border-color:var(--b);color:#fff}
button.btn:disabled{opacity:.6;cursor:default}
.small{font-size:13px;padding:9px 8px}

/* ---------- Timer ---------- */
.bigtimer{text-align:center;padding:2px 0 0}
.bigtimer .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.bigtimer .val{font-variant-numeric:tabular-nums;font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.bigtimer .val.warn{color:var(--warn)}
.bigtimer .tbtns{display:flex;gap:7px;margin-top:9px}

/* ---------- Teams ---------- */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tcol{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.thead{padding:7px 9px;font-weight:600;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead.a{background:var(--a)} .thead.b{background:var(--b)}
.tbody{padding:8px}
.inrow{display:flex;align-items:center;gap:5px;margin:5px 0}
.inrow span.idx{width:13px;color:var(--muted);font-size:11.5px;text-align:right;flex:0 0 auto}
.inrow input{flex:1;min-width:0;width:100%;padding:9px 5px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font-size:16px;text-align:center;font-variant-numeric:tabular-nums;
  font-family:inherit;font-weight:600}
.inrow input:focus{outline:2px solid var(--lime);outline-offset:-1px}
.inrow button.del{flex:0 0 auto;width:23px;height:23px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
.addrow{display:flex;gap:6px;margin-top:7px}
.addrow button{flex:1;padding:8px;border:1px dashed var(--line);background:var(--lime-t);color:var(--ink2);
  border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.stat{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 2px;color:var(--ink2)}
.stat b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

/* ---------- Duelle ---------- */
.duel{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:10px;margin-top:8px}
.duel.done{background:var(--lime-t);border-left-color:var(--lime)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dtitle{font-weight:600;font-size:13.5px}
.dres{font-size:13px;margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius);padding:3px 8px;
  font-size:12.5px;font-weight:600;color:#fff}
.chip.a{background:var(--a)} .chip.b{background:var(--b)} .chip.n{background:var(--muted)}
.drow{display:flex;gap:7px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin-top:7px}

/* ---------- Tally Teamgröße ---------- */
.tally{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.tally .tlab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  text-align:center;font-weight:600;margin-bottom:5px}
.tally .trow{display:flex;align-items:center;justify-content:center;gap:9px}
.tally button{width:36px;height:36px;flex:0 0 auto;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
.tally button:disabled{opacity:.35;cursor:default}
.tally .num{min-width:26px;text-align:center;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.tally.wide{margin-top:10px;border-top:0;background:var(--lime-t);border-left:3px solid var(--lime);
  border-radius:var(--radius);padding:10px 12px 11px}
.tally.wide .trow{gap:14px}
.tally.wide button{width:44px;height:40px;background:var(--card);font-size:22px}
.tally.wide .num{font-size:26px;min-width:38px}
.tally .tlab2{font-size:11.5px;color:var(--ink2);text-align:center;margin-top:7px;font-variant-numeric:tabular-nums}

/* ---------- Zähler ---------- */
.cnt{display:flex;align-items:center;gap:9px;justify-content:space-between;padding:6px 0}
.cnt .lab{font-size:13px}
.cnt .grp{display:flex;align-items:center;gap:8px}
.cnt button{width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:19px;line-height:1;cursor:pointer;font-family:inherit}
.cnt .num{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Auswertung ---------- */
.winner{padding:15px 14px;border-radius:var(--radius);color:#fff;margin-top:12px;
  border-left:5px solid rgba(255,255,255,.45)}
.winner .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.9}
.winner .big{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.winner .score{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.winner .sm{font-size:12px;opacity:.9;margin-top:1px}
.winner.a{background:var(--a)} .winner.b{background:var(--b)} .winner.tie{background:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{white-space:nowrap;padding-left:8px}
tr.total td{border-top:2px solid var(--lime);border-bottom:0;font-weight:700;font-size:15.5px;padding-top:10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.bar{margin:9px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .lbl b{font-variant-numeric:tabular-nums;font-weight:600}
.track{height:14px;background:color-mix(in srgb, var(--ink) 7%, transparent)}
.fill{height:14px;min-width:2px}
.det{font-size:12.5px;color:var(--ink2);margin-top:5px}
.seg{display:flex;gap:6px;margin:8px 0 2px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--lime);border-color:var(--lime);color:#3C3C3C}
.warnbox{font-size:12.5px;color:var(--ink2);background:var(--lime-t);border-left:3px solid var(--lime);
  padding:9px 11px;border-radius:var(--radius);margin-top:12px}
.nminput{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit;font-weight:600}
.cmfoot{text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.03em;margin:18px 0 6px}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ccc}
}
@media (max-width:359px){
  .clock{width:66px} .sb .nm{font-size:11px} .brand .t{font-size:16px} .logo{width:84px}
}
</style>
</head>

    <div class="sb b" data-goto="eval"><span class="lead" id="sbBl" hidden></span><span class="nm" id="sbBn">Team B</span><span class="pt" id="sbB">0</span></div>
  </div>
  <nav id="nav"></nav>
</header>

<div class="wrap" id="view"></div>
<div class="cmfoot">© by Company move GmbH</div>

<script>
"use strict";
/* ============================ Helfer ============================ */
const F = n => (Math.round(n*100)/100).toString().replace('.',',');
const pad = n => String(n).padStart(2,'0');
const fmtClock = ms => { const s=Math.max(0,Math.round(ms/1000)); return pad(Math.floor(s/60))+':'+pad(s%60); };
const fmtStop  = ms => { const t=Math.max(0,ms); const m=Math.floor(t/60000); const s=Math.floor(t%60000/1000);
                         return m+':'+pad(s)+'.'+Math.floor(t%1000/100); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function Clock(mode, durMs){ return {mode, dur:durMs||0, acc:0, at:null, run:false, fired:false}; }
function elapsed(c){ return c.acc + (c.run ? Date.now()-c.at : 0); }
function value(c){ return c.mode==='down' ? Math.max(0, c.dur-elapsed(c)) : elapsed(c); }
function start(c){ if(!c.run){ c.at=Date.now(); c.run=true; wakeOn(); } }
function pause(c){ if(c.run){ c.acc=elapsed(c); c.run=false; c.at=null; } }
function toggle(c){ c.run?pause(c):start(c); }
function reset(c){ c.acc=0; c.at=null; c.run=false; c.fired=false; }

/* ============================ Modell ============================ */
const S = {
  tab:'start',
  variant:'plank',                       // 'plank' | 'wall'
  names:{A:'Team A', B:'Team B'},
  gesamt: Clock('down', 20*60000),
  size:   6,                             // Teilnehmende pro Team (für beide gleich)
  grip:   { A:['','','','','',''], B:['','','','','',''] },
  plank:  { sw:Clock('up'), override:null, duels:[0,1,2,3,4,5].map(()=>({winner:null, at:null})) },
  wall:   { sw:Clock('up'), winner:null, limit:5*60000 },
  race:   { sw:Clock('up'), winner:null, time:null }
};
const PTS = { grip:2, duel:0.5, wall:2, race:3 };
const SIZE_MIN=2, SIZE_MAX=15;

/* ---- Von der Teamgröße abgeleitete Werte ---- */
const kisten = () => Math.max(1, S.size-1);              // n-1 Kisten pro Team
const duelAuto = () => S.size;
const duelCount = () => S.plank.override!==null ? S.plank.override : duelAuto();
function syncDuels(){
  const n=duelCount();
  while(S.plank.duels.length<n) S.plank.duels.push({winner:null, at:null});
  while(S.plank.duels.length>n) S.plank.duels.pop();
}
function setSize(d){
  const n=Math.min(SIZE_MAX, Math.max(SIZE_MIN, S.size+d));
  if(n===S.size) return;
  S.size=n;
  ['A','B'].forEach(k=>{
    const g=S.grip[k];
    while(g.length<n) g.push('');
    while(g.length>n) g.pop();
  });
  S.plank.override=null;                                  // Duelle folgen wieder der Teamgröße
  syncDuels();
}

/* ============================ Punkte ============================ */
function nums(arr){ return arr.filter(x=>x!=='' && x!==null && !isNaN(parseFloat(x))).map(parseFloat); }
function median(arr){
  const v=nums(arr).sort((a,b)=>a-b); if(!v.length) return null;
  const m=Math.floor(v.length/2);
  return v.length%2 ? v[m] : (v[m-1]+v[m])/2;
}
function sum(arr){ const v=nums(arr); return v.length ? v.reduce((a,b)=>a+b,0) : null; }
function gripResult(){
  const mA=median(S.grip.A), mB=median(S.grip.B), sA=sum(S.grip.A), sB=sum(S.grip.B);
  let w=null, why='';
  if(mA!==null && mB!==null){
    if(mA>mB){w='A';why='höherer Median';}
    else if(mB>mA){w='B';why='höherer Median';}
    else if(sA>sB){w='A';why='gleicher Median, höhere Summe';}
    else if(sB>sA){w='B';why='gleicher Median, höhere Summe';}
    else {w='tie';why='Median und Summe gleich';}
  }
  const p=PTS.grip;
  const pts = w==='A'?{A:p,B:0} : w==='B'?{A:0,B:p} : w==='tie'?{A:p/2,B:p/2} : {A:0,B:0};
  return {mA,mB,sA,sB,w,why,pts,max:p,nA:nums(S.grip.A).length,nB:nums(S.grip.B).length};
}
function plankResult(){
  const p={A:0,B:0}, d1=PTS.duel; let done=0;
  S.plank.duels.forEach(d=>{
    if(d.winner==='A'){p.A+=d1;done++;}
    else if(d.winner==='B'){p.B+=d1;done++;}
    else if(d.winner==='tie'){p.A+=d1/2;p.B+=d1/2;done++;}
  });
  return {pts:p,done,max:d1*S.plank.duels.length,per:d1};
}
function wallResult(){
  const w=S.wall.winner, p=PTS.wall;
  const pts = w==='A'?{A:p,B:0} : w==='B'?{A:0,B:p} : w==='tie'?{A:p/2,B:p/2} : {A:0,B:0};
  return {pts,max:p,w};
}
function raceResult(){
  const w=S.race.winner, p=PTS.race;
  const pts = w==='A'?{A:p,B:0} : w==='B'?{A:0,B:p} : {A:0,B:0};
  return {pts,w,max:p,time:S.race.time};
}
function totals(){
  const g=gripResult(), s2 = S.variant==='plank'?plankResult():wallResult(), r=raceResult();
  const rows=[
    {key:'grip', name:'Station 1 · Handkraft', pts:g.pts, max:g.max},
    S.variant==='plank'
      ? {key:'plank', name:'Station 2 · Plank', pts:s2.pts, max:s2.max}
      : {key:'wall',  name:'Station 2.1 · Wandsitzen', pts:s2.pts, max:s2.max},
    {key:'race', name:'Station 3 · Wasserkistenrennen', pts:r.pts, max:r.max}
  ];
  const tot={A:0,B:0};
  rows.forEach(r0=>{tot.A+=r0.pts.A;tot.B+=r0.pts.B;});
  const max=rows.reduce((a,r0)=>a+r0.max,0);
  const w = tot.A>tot.B?'A' : tot.B>tot.A?'B' : 'tie';
  return {rows,tot,max,w,g,s2,r};
}
function anyData(){
  const t=totals();
  return t.tot.A>0||t.tot.B>0||S.grip.A.some(x=>x!=='')||S.grip.B.some(x=>x!=='')||elapsed(S.gesamt)>0;
}

/* ============================ Wake Lock / Ton ============================ */
let wl=null;
async function wakeOn(){ try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen');
  wl.addEventListener('release',()=>{wl=null;}); } }catch(e){} }
function anyRunning(){
  return [S.gesamt,S.plank.sw,S.wall.sw,S.race.sw].some(c=>c.run);
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && anyRunning()) wakeOn(); });
let AC=null;
function beep(times){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<(times||2);i++){
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*0.28;
      o.frequency.value=880; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.start(t); o.stop(t+0.24);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

/* ============================ Tabs ============================ */
const TABS = () => ([
  {id:'start', label:'Ablauf'},
  {id:'grip',  label:'S1 Handkraft'},
  S.variant==='plank' ? {id:'plank', label:'S2 Plank'} : {id:'wall', label:'S2.1 Wandsitzen'},
  {id:'race',  label:'S3 Kistenrennen'},
  {id:'eval',  label:'Gesamtauswertung'}
]);
function stationDone(id){
  if(id==='grip') return gripResult().w!==null;
  if(id==='plank'){ const p=plankResult(); return p.done===S.plank.duels.length && p.done>0; }
  if(id==='wall') return S.wall.winner!==null;
  if(id==='race') return raceResult().w!==null;
  return false;
}
function renderNav(){
  document.getElementById('nav').innerHTML = TABS().map(t=>
    `<button data-tab="${t.id}" class="${t.id==='eval'?'eval ':''}${S.tab===t.id?'on':''}">${t.label}${stationDone(t.id)?'<span class="dot"></span>':''}</button>`
  ).join('');
}

/* ============================ Views ============================ */
function vStart(){
  const t=totals();
  return `
  <div class="card">
    <h2>Teams</h2>
    <p class="sub">In jeder Disziplin treten gleich viele an</p>
    <div class="tgrid">
      <div class="tcol"><div class="thead a">Team A</div><div class="tbody">
        <input class="nm nminput" data-team="A" value="${esc(S.names.A)}"></div></div>
      <div class="tcol"><div class="thead b">Team B</div><div class="tbody">
        <input class="nm nminput" data-team="B" value="${esc(S.names.B)}"></div></div>
    </div>
    <div class="tally wide">
      <div class="tlab">Antretende pro Team</div>
      <div class="trow">
        <button data-act="size" data-d="-1" ${S.size<=SIZE_MIN?'disabled':''}>−</button>
        <span class="num">${S.size}</span>
        <button data-act="size" data-d="1" ${S.size>=SIZE_MAX?'disabled':''}>+</button>
      </div>
      <div class="tlab2">${S.size} Messungen · ${duelCount()} Duelle · ${kisten()} Kisten pro Team</div>
    </div>
    <p class="hint">Größeres Team: pro Disziplin setzt jemand aus.</p>
  </div>

  <div class="card">
    <h2>Ablauf · 20 Minuten</h2>
    <p class="sub">2 Gruppen à ${S.size}</p>
    <table>
      <tr><td>Einführung · Übersicht &amp; Gruppen</td><td class="n" style="color:var(--muted)">2 min</td><td class="n">–</td></tr>
      <tr><td>Station 1 · Handkraftmessung<br><span class="hint" style="margin:0">${S.size} Messungen pro Team</span></td><td class="n" style="color:var(--muted)">4 min</td><td class="n">2 P.</td></tr>
      ${S.variant==='plank'
        ? `<tr><td>Station 2 · Plank<br><span class="hint" style="margin:0">${duelCount()} Duelle à 0,5 P.</span></td><td class="n" style="color:var(--muted)">6 min</td><td class="n">${F(plankResult().max)} P.</td></tr>`
        : '<tr><td>Station 2.1 · Wandsitzen<br><span class="hint" style="margin:0">2 gegen 2</span></td><td class="n" style="color:var(--muted)">6 min</td><td class="n">2 P.</td></tr>'}
      <tr><td>Station 3 · Wasserkistenrennen<br><span class="hint" style="margin:0">${kisten()} Kisten pro Team</span></td><td class="n" style="color:var(--muted)">7 min</td><td class="n">3 P.</td></tr>
      <tr class="total"><td>Maximal</td><td class="n" style="color:var(--muted)">19 min</td><td class="n">${F(t.max)} P.</td></tr>
    </table>

    <h3>Station 2 – Variante</h3>
    <div class="seg">
      <button data-var="plank" class="${S.variant==='plank'?'on':''}">Plank · ${F(PTS.duel*duelCount())} P.</button>
      <button data-var="wall" class="${S.variant==='wall'?'on':''}">Wandsitzen · 2 P.</button>
    </div>
    <p class="hint">Backup bei ungeeignetem Boden. Nur die gewählte Variante zählt.</p>

    <div class="warnbox">Eingaben werden auf dem Gerät gesichert. Nach einem Neustart stehen laufende Timer still und gehen mit „Weiter“ weiter.</div>
  </div>`;
}

function vGrip(){
  const g=gripResult();
  const col=(k,cls)=>`<div class="tcol">
      <div class="thead ${cls}">${esc(S.names[k])}</div>
      <div class="tbody">
        ${S.grip[k].map((v,i)=>`<div class="inrow"><span class="idx">${i+1}</span>
          <input inputmode="decimal" enterkeyhint="next" placeholder="kg" data-grip="${k}" data-i="${i}" value="${esc(v)}">
          ${S.grip[k].length>1?`<button class="del" data-act="gdel" data-w="${k}" data-i="${i}" title="Zeile entfernen">×</button>`:''}
        </div>`).join('')}
        <div class="addrow"><button data-act="gadd" data-w="${k}">+ Messung</button></div>
        <div class="stat" style="margin-top:6px"><span>Messungen</span><b>${g['n'+k]}</b></div>
        <div class="stat"><span>Median</span><b>${g['m'+k]===null?'–':F(g['m'+k])+' kg'}</b></div>
        <div class="stat"><span>Summe</span><b>${g['s'+k]===null?'–':F(g['s'+k])+' kg'}</b></div>
      </div></div>`;
  return `<div class="card">
    <h2>Station 1 · Handkraftmessung</h2><p class="sub">4 Minuten · 2 Punkte · ${S.size} Messungen pro Team</p>
    <div class="tgrid">${col('A','a')}${col('B','b')}</div>
    <div class="dres" id="gripres" style="margin-top:12px">${gripChip(g)}</div>
    <p class="hint">Zeilen kommen aus der Teamgröße · „+ Messung“ ergänzt, × entfernt.</p>
    <ul class="rules"><li>Jede Person drückt einmal</li>
      <li>Besserer Median gewinnt, bei Gleichstand die höhere Summe</li></ul>
  </div>`;
}
function gripChip(g){
  return g.w===null ? '<span class="chip n">noch offen</span><span class="det">Werte für beide Teams eintragen</span>'
    : g.w==='tie' ? `<span class="chip n">Gleichstand</span><span class="det">${F(PTS.grip/2)} : ${F(PTS.grip/2)} Punkte · ${g.why}</span>`
    : `<span class="chip ${g.w.toLowerCase()}">${esc(S.names[g.w])} +${F(PTS.grip)}</span><span class="det">${g.why}</span>`;
}

function vPlank(){
  const p=plankResult(), n=S.plank.duels.length, sw=S.plank.sw;
  const duels = S.plank.duels.map((d,i)=>
    `<div class="duel ${d.winner?'done':''}">
      ${d.winner ? `<div class="dres" style="margin-top:0">
            <span class="dtitle" style="min-width:62px">Duell ${i+1}</span>
            ${d.winner==='tie' ? `<span class="chip n">je ${F(p.per/2)}</span>`
              : `<span class="chip ${d.winner.toLowerCase()}">${esc(S.names[d.winner])} +${F(p.per)}</span>`}
            <span class="det">${d.at!==null?fmtStop(d.at):''}</span>
            <button class="btn ghost small" style="flex:0 0 auto;margin-left:auto" data-act="dundo" data-i="${i}">↺</button>
          </div>`
        : `<div class="dhead"><span class="dtitle">Duell ${i+1}</span>
             <span class="det">wer hält länger?</span></div>
           <div class="drow">
            <button class="btn a" data-act="dwin" data-i="${i}" data-w="A">${esc(S.names.A)}</button>
            <button class="btn b" data-act="dwin" data-i="${i}" data-w="B">${esc(S.names.B)}</button>
            <button class="btn ghost" data-act="dwin" data-i="${i}" data-w="tie" style="flex:0 0 44px">=</button>
          </div>`}
    </div>`).join('');
  return `<div class="card">
    <h2>Station 2 · Plank</h2><p class="sub">6 Minuten · alle Duelle gleichzeitig · je 0,5 Punkte</p>
    <div class="bigtimer">
      <div class="lbl">Haltezeit</div>
      <div class="val" data-cv="planksw">${fmtStop(value(sw))}</div>
      <div class="tbtns">
        <button class="btn ${sw.run?'':'primary'}" data-act="ptgl">${sw.run?'Pause':(elapsed(sw)>0?'Weiter':'Start')}</button>
        <button class="btn ghost" data-act="prst">Zurücksetzen</button>
      </div>
    </div>
    <div class="cnt" style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
      <span class="lab">Anzahl Duelle<br><span class="hint" style="margin:0">${S.plank.override===null
        ? `aus Teamgröße (${S.size} pro Team) · max. ${F(p.max)} P.`
        : `manuell · max. ${F(p.max)} P.`}</span></span>
      <span class="grp"><button data-act="dcount" data-d="-1">−</button>
      <span class="num">${n}</span>
      <button data-act="dcount" data-d="1">+</button></span></div>
    <h3 class="tight">Duelle · ${p.done}/${n} gewertet</h3>
    <p class="hint" style="margin-top:0">Ein Timer für alle Duelle. Wer die Form bricht, ist raus – Button des <b>Gewinnerteams</b> drücken.</p>
    ${duels}
    <div class="dres" style="margin-top:12px">
      <span class="chip a">${esc(S.names.A)} ${F(p.pts.A)}</span>
      <span class="chip b">${esc(S.names.B)} ${F(p.pts.B)}</span>
      <span class="det">von ${F(p.max)} Punkten</span>
    </div>
  </div>`;
}

function vWall(){
  const t=value(S.wall.sw), over=t>=S.wall.limit;
  return `<div class="card">
    <h2>Station 2.1 · Wandsitzen</h2><p class="sub">6 Minuten · 2 Punkte · Rücken an Rücken</p>
    <div class="bigtimer">
      <div class="lbl">Haltezeit · 2 gegen 2</div>
      <div class="val ${over?'warn':''}" data-cv="wallsw">${fmtStop(t)}</div>
      ${S.wall.winner?'':`<div class="tbtns">
        <button class="btn ${S.wall.sw.run?'':'primary'}" data-act="wtgl">${S.wall.sw.run?'Pause':(elapsed(S.wall.sw)>0?'Weiter':'Start')}</button>
        <button class="btn ghost" data-act="wrst">Zurücksetzen</button></div>`}
    </div>
    <div class="duel ${S.wall.winner?'done':''}" style="margin-top:12px">
      ${S.wall.winner ? `<div class="dres" style="margin-top:0">
            ${S.wall.winner==='tie' ? `<span class="chip n">Gleichstand · ${F(PTS.wall/2)} : ${F(PTS.wall/2)}</span>`
              : `<span class="chip ${S.wall.winner.toLowerCase()}">${esc(S.names[S.wall.winner])} +${F(PTS.wall)}</span>`}
            <span class="det">Zeit ${fmtStop(t)}</span>
            <button class="btn ghost small" style="flex:0 0 auto;margin-left:auto" data-act="wundo">↺</button></div>`
        : `<div class="dhead"><span class="dtitle">Wer hält länger?</span></div>
           <div class="drow">
             <button class="btn a" data-act="wwin" data-w="A">${esc(S.names.A)} +2</button>
             <button class="btn b" data-act="wwin" data-w="B">${esc(S.names.B)} +2</button></div>
           <div class="drow"><button class="btn ghost small" data-act="wwin" data-w="tie">Gleichstand (1 : 1)</button></div>
           ${over?'<div class="hint" style="color:var(--warn)"><b>5-Minuten-Limit erreicht → Gleichstand werten.</b></div>':''}`}
    </div>
    <ul class="rules"><li>2 gegen 2, Rücken an Rücken, Knie 90 Grad</li>
      <li>Wer länger hält, gewinnt · Limit 5 min → Gleichstand</li></ul>
  </div>`;
}

function vRace(){
  const r=raceResult(), t=value(S.race.sw);
  return `<div class="card">
    <h2>Station 3 · Wasserkistenrennen</h2><p class="sub">7 Minuten · 3 Punkte · ${kisten()} Kisten pro Team</p>
    <div class="bigtimer">
      <div class="lbl">${r.w?'Siegerzeit':'Laufzeit'}</div>
      <div class="val" data-cv="racesw">${fmtStop(r.w?r.time:t)}</div>
      ${r.w?'':`<div class="tbtns">
        <button class="btn ${S.race.sw.run?'':'primary'}" data-act="rtgl">${S.race.sw.run?'Pause':(elapsed(S.race.sw)>0?'Weiter':'Start')}</button>
        <button class="btn ghost" data-act="rrst">Zurücksetzen</button></div>`}
    </div>
    <div class="duel ${r.w?'done':''}" style="margin-top:12px">
      ${r.w
        ? `<div class="dres" style="margin-top:0">
             <span class="chip ${r.w.toLowerCase()}">${esc(S.names[r.w])} +${F(PTS.race)}</span>
             <span class="det">im Ziel nach ${fmtStop(r.time)}</span>
             <button class="btn ghost small" style="flex:0 0 auto;margin-left:auto" data-act="rundo">↺</button></div>`
        : `<div class="dhead"><span class="dtitle">Wer überquert zuerst die Ziellinie?</span></div>
           <div class="drow">
             <button class="btn a" data-act="fin" data-w="A">${esc(S.names.A)} +3</button>
             <button class="btn b" data-act="fin" data-w="B">${esc(S.names.B)} +3</button></div>
           <p class="hint">Ein Tipp beendet das Rennen.</p>`}
    </div>
    <ul class="rules"><li><b>${kisten()} Kisten pro Team</b> (${S.size} − 1), alle stehen auf den umgedrehten Kisten</li>
      <li>Hinterste Kiste nach vorne reichen – immer 2 auf einer Kiste</li>
      <li>Wer runterfällt: Strafrunde zur Startlinie, dann weiterreichen</li></ul>
  </div>`;
}

function vEval(){
  const t=totals(), g=t.g, r=t.r;
  const bar=(k,cls)=>{
    const pct = t.max? (t.tot[k]/t.max*100):0;
    return `<div class="bar"><div class="lbl"><span>${esc(S.names[k])}</span><b>${F(t.tot[k])} von ${F(t.max)} P.</b></div>
      <div class="track"><div class="fill" style="width:${Math.max(pct,1.5)}%;background:var(--${cls})"></div></div></div>`;
  };
  const det = [
    `Handkraft – Median ${g.mA===null?'–':F(g.mA)+' kg'} : ${g.mB===null?'–':F(g.mB)+' kg'} · Summe ${g.sA===null?'–':F(g.sA)} : ${g.sB===null?'–':F(g.sB)} kg · ${g.nA} : ${g.nB} Messungen`,
    S.variant==='plank'
      ? `Plank (Gesamtzeit ${fmtStop(value(S.plank.sw))}) – ` + S.plank.duels.map((d,i)=>`D${i+1} ${d.winner? (d.winner==='tie'?'=':esc(S.names[d.winner]))+(d.at!==null?' ('+fmtStop(d.at)+')':'') : '–'}`).join(' · ')
      : 'Wandsitzen – Haltezeit '+fmtStop(value(S.wall.sw))+(S.wall.winner?' · Sieg '+(S.wall.winner==='tie'?'Gleichstand':esc(S.names[S.wall.winner])):''),
    `Kistenrennen – ${r.w?'Sieger '+esc(S.names[r.w])+' · Siegerzeit '+fmtStop(r.time):'noch offen'}`
  ];
  const offen = t.rows.filter(r0=>!stationDone(r0.key)).length;
  return `<div class="winner ${t.w.toLowerCase()}">
      <div class="lbl">${t.w==='tie'?(offen?'Zwischenstand':'Endergebnis'):(offen?'Führung':'Sieger')}</div>
      <div class="big">${t.w==='tie'?'Unentschieden':esc(S.names[t.w])}</div>
      <div class="score">${F(t.tot.A)} : ${F(t.tot.B)}</div>
      <div class="sm">${offen?offen+' von 3 Stationen noch offen':'alle Stationen gewertet'}</div>
    </div>
    <div class="card">
      <h2>Gesamtauswertung</h2><p class="sub">Punkte je Station · maximal ${F(t.max)}</p>
      <div class="legend"><span><i style="background:var(--a)"></i>${esc(S.names.A)}</span><span><i style="background:var(--b)"></i>${esc(S.names.B)}</span></div>
      ${bar('A','a')}${bar('B','b')}
      <table>
        <tr><th>Station</th><th class="n">${esc(S.names.A)}</th><th class="n">${esc(S.names.B)}</th><th class="n">max</th></tr>
        ${t.rows.map(r0=>`<tr><td>${r0.name}${stationDone(r0.key)?'':' <span style="color:var(--muted);font-size:12px">(offen)</span>'}</td><td class="n">${F(r0.pts.A)}</td><td class="n">${F(r0.pts.B)}</td><td class="n" style="color:var(--muted)">${F(r0.max)}</td></tr>`).join('')}
        <tr class="total"><td>Gesamt</td><td class="n">${F(t.tot.A)}</td><td class="n">${F(t.tot.B)}</td><td class="n" style="color:var(--muted)">${F(t.max)}</td></tr>
      </table>
      <h3>Details</h3>
      ${det.map(d=>`<div class="det">${d}</div>`).join('')}
      <div class="drow noprint" style="margin-top:14px">
        <button class="btn primary" data-act="copy">Ergebnis kopieren</button>
        <button class="btn" data-act="print">Drucken / PDF</button>
      </div>
      <div class="drow noprint" style="margin-top:8px">
        <button class="btn ghost small" data-act="clear">Alles zurücksetzen</button>
      </div>
    </div>`;
}

const VIEWS={start:vStart,grip:vGrip,plank:vPlank,wall:vWall,race:vRace,eval:vEval};
function render(){
  if(!TABS().map(t=>t.id).includes(S.tab)) S.tab='start';
  renderNav();
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  tick();
}

/* ============================ Tick ============================ */
function tick(){
  const gv=value(S.gesamt);
  document.getElementById('gesamtT').textContent=fmtClock(gv);
  document.getElementById('gesamtBtn').textContent=S.gesamt.run?'❚❚':'▶';
  const gb=document.getElementById('gesamtBox');
  gb.classList.toggle('warn', gv>0&&gv<=60000); gb.classList.toggle('crit', gv<=0&&elapsed(S.gesamt)>0);
  if(S.gesamt.run && gv<=0 && !S.gesamt.fired){ S.gesamt.fired=true; pause(S.gesamt); beep(3); }

  const t=totals();
  document.getElementById('sbA').textContent=F(t.tot.A);
  document.getElementById('sbB').textContent=F(t.tot.B);
  document.getElementById('sbAn').textContent=S.names.A;
  document.getElementById('sbBn').textContent=S.names.B;
  document.getElementById('sbAl').hidden = t.w!=='A';
  document.getElementById('sbBl').hidden = t.w!=='B';
  document.getElementById('brandSub').textContent =
    `Bewegungsstation · 20 Min · ${S.size} gegen ${S.size}`;

  document.querySelectorAll('[data-cv]').forEach(el=>{
    const id=el.getAttribute('data-cv');
    let c=null;
    if(id==='planksw') c=S.plank.sw;
    else if(id==='wallsw') c=S.wall.sw;
    else if(id==='racesw') c=S.race.sw;
    if(!c) return;
    const v=value(c);
    el.textContent = fmtStop(v);
    if(id==='wallsw'){
      el.classList.toggle('warn', v>=S.wall.limit);
      if(c.run && v>=S.wall.limit && !c.fired){ c.fired=true; beep(2); render(); }
    }
  });
}
setInterval(tick,100);

/* ============================ Events ============================ */
document.addEventListener('click', e=>{
  const nb=e.target.closest('nav button');
  if(nb){ S.tab=nb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const gt=e.target.closest('[data-goto]');
  if(gt){ S.tab=gt.dataset.goto; render(); window.scrollTo(0,0); return; }
  const vb=e.target.closest('[data-var]');
  if(vb){ S.variant=vb.dataset.var; render(); return; }

  if(e.target.id==='gesamtBtn'){ toggle(S.gesamt); tick(); return; }
  if(e.target.id==='gesamtRst'){ reset(S.gesamt); tick(); return; }

  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, i=+b.dataset.i, w=b.dataset.w;
  if(a==='gadd'){ S.grip[w].push(''); }
  else if(a==='gdel'){ if(S.grip[w].length>1) S.grip[w].splice(i,1); }
  else if(a==='size'){ setSize(+b.dataset.d); }
  else if(a==='dcount'){
    const n=Math.min(15, Math.max(1, duelCount()+(+b.dataset.d)));
    S.plank.override = n===duelAuto() ? null : n;
    syncDuels();
  }
  else if(a==='ptgl'){ toggle(S.plank.sw); }
  else if(a==='prst'){ reset(S.plank.sw); }
  else if(a==='dwin'){ S.plank.duels[i].winner=w; S.plank.duels[i].at=value(S.plank.sw);
                       if(plankResult().done===S.plank.duels.length) pause(S.plank.sw); }
  else if(a==='dundo'){ S.plank.duels[i].winner=null; S.plank.duels[i].at=null; }
  else if(a==='wtgl'){ toggle(S.wall.sw); }
  else if(a==='wrst'){ reset(S.wall.sw); }
  else if(a==='wwin'){ pause(S.wall.sw); S.wall.winner=w; }
  else if(a==='wundo'){ S.wall.winner=null; }
  else if(a==='rtgl'){ toggle(S.race.sw); }
  else if(a==='rrst'){ reset(S.race.sw); S.race.winner=null; S.race.time=null; }
  else if(a==='fin'){ S.race.time=value(S.race.sw); pause(S.race.sw); S.race.winner=w; }
  else if(a==='rundo'){ S.race.winner=null; S.race.time=null; }
  else if(a==='print'){ window.print(); return; }
  else if(a==='copy'){ copyResult(b); return; }
  else if(a==='clear'){ if(confirm('Alle Werte, Punkte und Timer zurücksetzen?')){ wipe(); location.reload(); } return; }
  render();
});
document.addEventListener('input', e=>{
  const g=e.target.closest('[data-grip]');
  if(g){
    S.grip[g.dataset.grip][+g.dataset.i]=g.value.replace(',','.');
    const gr=gripResult(), k=g.dataset.grip, col=g.closest('.tbody');
    const st=col.querySelectorAll('.stat b');
    st[0].textContent = gr['n'+k];
    st[1].textContent = gr['m'+k]===null?'–':F(gr['m'+k])+' kg';
    st[2].textContent = gr['s'+k]===null?'–':F(gr['s'+k])+' kg';
    const res=document.getElementById('gripres'); if(res) res.innerHTML=gripChip(gr);
    renderNav();
  }
  const n=e.target.closest('.nm');
  if(n){ S.names[n.dataset.team]=n.value.trim()||('Team '+n.dataset.team); }
});

function resultText(){
  const t=totals(), g=t.g;
  const L=[];
  L.push('Azubi-Olympiade · Bewegungsstation – Ergebnis');
  L.push(new Date().toLocaleString('de-DE'));
  L.push('');
  t.rows.forEach(r0=>L.push(`${r0.name}: ${S.names.A} ${F(r0.pts.A)} – ${S.names.B} ${F(r0.pts.B)} (max ${F(r0.max)})`));
  L.push('');
  L.push(`GESAMT: ${S.names.A} ${F(t.tot.A)} – ${S.names.B} ${F(t.tot.B)}`);
  L.push(t.w==='tie'?'Unentschieden':'Sieger: '+S.names[t.w]);
  L.push('');
  L.push('Details:');
  L.push(`- Handkraft Median: ${g.mA===null?'–':F(g.mA)} kg / ${g.mB===null?'–':F(g.mB)} kg; Summe ${g.sA===null?'–':F(g.sA)} / ${g.sB===null?'–':F(g.sB)} kg`);
  L.push(`- Einzelwerte ${S.names.A}: ${S.grip.A.map(x=>x===''?'–':F(parseFloat(x))).join(', ')}`);
  L.push(`- Einzelwerte ${S.names.B}: ${S.grip.B.map(x=>x===''?'–':F(parseFloat(x))).join(', ')}`);
  if(S.variant==='plank') L.push(`- Plank (${S.plank.duels.length} Duelle à 0,5 P., Gesamtzeit ${fmtStop(value(S.plank.sw))}): `+S.plank.duels.map((d,i)=>`D${i+1} ${d.winner?(d.winner==='tie'?'unentschieden':S.names[d.winner])+(d.at!==null?' ('+fmtStop(d.at)+')':''):'offen'}`).join('; '));
  else L.push(`- Wandsitzen: Haltezeit ${fmtStop(value(S.wall.sw))}${S.wall.winner?', Sieg '+(S.wall.winner==='tie'?'Gleichstand':S.names[S.wall.winner]):''}`);
  L.push(`- Kistenrennen: ${S.race.winner?'Sieger '+S.names[S.race.winner]+', Siegerzeit '+fmtStop(S.race.time):'offen'}`);
  return L.join('\n');
}
function copyResult(btn){
  const txt=resultText();
  const done=()=>{ btn.textContent='Kopiert ✓'; setTimeout(()=>{btn.textContent='Ergebnis kopieren';},1600); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, ()=>fallback(txt,done)); }
  else fallback(txt,done);
}
function fallback(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ prompt('Ergebnis kopieren:', txt); }
  document.body.removeChild(ta);
}
/* ============================ Sicherung auf dem Gerät ============================ */
/* Alles bleibt lokal im Browser – keine Übertragung an einen Server. */
const KEY='cm-bewegungsstation-v1';
const store = (()=>{ try{ const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
                          return localStorage; }catch(e){ return null; } })();
const froze = c => ({mode:c.mode, dur:c.dur, acc:elapsed(c), run:false, fired:c.fired});
let wiped=false;
function save(){
  if(!store || wiped) return;
  try{
    store.setItem(KEY, JSON.stringify({
      v:1, tab:S.tab, variant:S.variant, names:S.names, size:S.size,
      gesamt:froze(S.gesamt), grip:S.grip,
      plank:{sw:froze(S.plank.sw), override:S.plank.override,
             duels:S.plank.duels.map(d=>({winner:d.winner, at:d.at}))},
      wall:{sw:froze(S.wall.sw), winner:S.wall.winner},
      race:{sw:froze(S.race.sw), winner:S.race.winner, time:S.race.time}
    }));
  }catch(e){}
}
function load(){
  if(!store) return false;
  try{
    const d=JSON.parse(store.getItem(KEY)||'null');
    if(!d || d.v!==1) return false;
    const clk=(o,mode,dur)=>{ const c=Clock(mode,dur);
      if(o&&typeof o.acc==='number'){ c.acc=o.acc; c.fired=!!o.fired; if(typeof o.dur==='number') c.dur=o.dur; }
      return c; };
    if(d.variant==='plank'||d.variant==='wall') S.variant=d.variant;
    if(d.names&&d.names.A&&d.names.B) S.names={A:String(d.names.A), B:String(d.names.B)};
    if(Number.isFinite(d.size)) S.size=Math.min(SIZE_MAX, Math.max(SIZE_MIN, d.size));
    S.gesamt=clk(d.gesamt,'down',20*60000);
    if(d.grip&&Array.isArray(d.grip.A)&&Array.isArray(d.grip.B)) S.grip={A:d.grip.A.map(String), B:d.grip.B.map(String)};
    if(d.plank){
      S.plank.sw=clk(d.plank.sw,'up');
      S.plank.override=Number.isFinite(d.plank.override)?d.plank.override:null;
      if(Array.isArray(d.plank.duels)) S.plank.duels=d.plank.duels.map(x=>({winner:x&&x.winner||null, at:x&&typeof x.at==='number'?x.at:null}));
    }
    if(d.wall){ S.wall.sw=clk(d.wall.sw,'up'); S.wall.winner=d.wall.winner||null; }
    if(d.race){ S.race.sw=clk(d.race.sw,'up'); S.race.winner=d.race.winner||null;
                S.race.time=typeof d.race.time==='number'?d.race.time:null; }
    syncDuels();
    if(TABS().map(t=>t.id).includes(d.tab)) S.tab=d.tab;
    return true;
  }catch(e){ return false; }
}
function wipe(){ wiped=true; try{ if(store) store.removeItem(KEY); }catch(e){} }

document.addEventListener('click', save);
document.addEventListener('input', save);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') save(); });
setInterval(()=>{ if(anyRunning()) save(); }, 2000);

load();
render();

/* ============================ Offline-Betrieb ============================ */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
